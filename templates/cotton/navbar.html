{% load i18n %}
<div class="mx-auto flex w-full {{ max_width|default:"max-w-3xl" }} items-center gap-3 px-4 py-3">
    <a href="{% url 'home' %}" class="flex min-w-0 shrink-0 items-center gap-3">
        {% if association.logo %}
            <img src="{{ association.logo.url }}" alt="" class="h-10 w-auto shrink-0" />
        {% endif %}
        <span class="min-w-0 truncate text-sm font-semibold tracking-tight">{{ association.name|default:"OpenSeat" }}</span>
    </a>
    <div class="text-base-content/70 ml-auto flex shrink-0 items-center gap-3 text-sm">
        {% if request.user.is_authenticated %}
            <a href="{% url 'account-hub' %}" class="link link-hover">
                {% translate "Account" %}
            </a>
            <a href="{% url 'account_logout' %}" class="link link-hover">
                {% translate "Sign out" %}
            </a>
        {% else %}
            <a href="{% url 'account_login' %}" class="link link-hover">
                {% translate "Login" %}
            </a>
        {% endif %}
    </div>
</div>
