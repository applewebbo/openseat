{% load i18n %}<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'it' }}">
    <head>
        <meta charset="utf-8" />
        <title>{% translate "Your account has been approved" %}</title>
    </head>
    <body style="margin:0;padding:24px;background:#f6f4f1;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1f2124;line-height:1.5">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:520px;margin:0 auto">
            <tr>
                <td style="background:#ffffff;border:1px solid rgba(0,0,0,.06);border-radius:16px;padding:28px">
                    <p style="margin:0;font-size:13px;font-weight:600;color:{{ association.colour_primary }}">
                        {{ association.name }}
                    </p>
                    <h1 style="margin:8px 0 0;font-size:22px;line-height:1.25;font-weight:700">
                        {% translate "You're in" %}
                    </h1>
                    <p style="margin:10px 0 0;font-size:14px;color:rgba(31,33,36,.7)">
                        {% translate "Your account has been approved. You can now sign in." %}
                    </p>
                    <p style="margin:28px 0 0">
                        <a href="{{ login_url }}"
                           style="display:inline-block;padding:12px 22px;border-radius:12px;background:{{ association.colour_primary }};color:#ffffff;font-size:15px;font-weight:600;text-decoration:none">
                            {% translate "Sign In" %}
                        </a>
                    </p>
                </td>
            </tr>
            <tr>
                <td style="padding:18px 28px;font-size:12px;color:rgba(31,33,36,.55)">
                    {{ association.name }}
                </td>
            </tr>
        </table>
    </body>
</html>
