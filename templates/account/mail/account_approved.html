{% load i18n %}<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'it' }}">
    <head>
        <meta charset="utf-8" />
        <title>{% translate "Your account has been approved" %}</title>
    </head>
    <body style="margin:0;padding:0;background:#ffffff;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1f2124;line-height:1.5">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:520px;margin:0 auto">
            <tr>
                <td style="background:{{ association.colour_primary }};height:4px;line-height:4px;font-size:0">&nbsp;</td>
            </tr>
            <tr>
                <td style="padding:32px 28px 8px">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 16px">
                        <tr>
                            {% if association.logo %}
                                <td style="padding-right:10px;vertical-align:middle">
                                    <img src="cid:association-logo"
                                         alt="{{ association.name }}"
                                         height="28"
                                         style="height:28px;width:auto;display:block" />
                                </td>
                            {% endif %}
                            <td style="vertical-align:middle;font-size:14px;font-weight:600;color:#1f2124">{{ association.name }}</td>
                        </tr>
                    </table>
                    <h1 style="margin:0;font-size:22px;line-height:1.25;font-weight:700">
                        {% translate "You're in" %}
                    </h1>
                    <p style="margin:10px 0 0;font-size:14px;color:rgba(31,33,36,.7)">
                        {% translate "Your account has been approved. You can now sign in." %}
                    </p>
                    <p style="margin:28px 0 0">
                        <a href="{{ login_url }}"
                           style="display:inline-block;padding:12px 22px;border-radius:12px;background:{{ association.colour_primary }};color:#ffffff;font-size:15px;font-weight:600;text-decoration:none">
                            {% translate "Sign In" %}
                        </a>
                    </p>
                </td>
            </tr>
            <tr>
                <td style="padding:8px 28px 32px;font-size:12px;color:rgba(31,33,36,.55)">
                    {{ association.name }}
                </td>
            </tr>
        </table>
    </body>
</html>
