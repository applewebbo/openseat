{% load allauth %}
<section class="border-base-300 space-y-2 border-t pt-4 first:border-t-0 first:pt-0">
    <h2 class="text-base font-semibold tracking-tight">
        {% slot title %}
        {% endslot %}
    </h2>
    {% slot body %}
    {% endslot %}
    {% if slots.actions %}
        <div class="flex flex-wrap gap-2">
            {% for action in slots.actions %}{{ action }}{% endfor %}
        </div>
    {% endif %}
</section>
