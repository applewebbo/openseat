{% load allauth %}
<form method="{{ attrs.method }}"
      {% if attrs.action %}action="{{ attrs.action }}"{% endif %}>
    <div class="flex flex-col gap-4">
        {% slot body %}
        {% endslot %}
    </div>
    <div class="mt-4 flex flex-wrap items-center gap-2">
        {% slot actions %}
        {% endslot %}
    </div>
</form>
