[dependency-groups]
dev = [
  "coverage",
  "django-coverage-plugin",
  "django-crawl",
  "django-devbar",
  "django-test-plus",
  "django-watchfiles",
  "djade",
  "djlint",
  "factory-boy",
  "httpx",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "pytest-django",
  "pytest-factoryboy",
  "pytest-httpx",
  "pytest-mock",
  "pytest-xdist",
  "ruff",
  "time-machine"
]

[project]
dependencies = [
  "crispy-tailwind",
  "dj-database-url",
  "django>=6.1",
  "django-allauth[socialaccount]",
  "django-anymail[mailgun]",
  "django-browser-reload",
  "django-ckeditor-5>=0.2.20",
  "django-cotton",
  "django-crispy-forms",
  "django-dbbackup",
  "django-environ",
  "django-extensions",
  "django-health-check[redis]>=4.5.1",
  "django-htmx",
  "django-import-export>=4.4.1",
  "django-pwa",
  "django-q2",
  "django-redis",
  "django-storages[s3]",
  "django-tailwind-cli",
  "granian[pname]",
  "nh3>=0.3.6",
  "openpyxl>=3.1.5",
  "pillow",
  "psycopg[binary]",
  "redis",
  "uvloop",
  "whitenoise"
]
description = "Self-hosted event bookings and membership roster for non-profit associations"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
name = "openseat"
readme = "README.md"
requires-python = ">=3.14"
version = "2026.3"

[tool.bandit]
exclude_dirs = ["tests"]  # fixture credentials are not secrets
# B105 misreads ACCOUNT_FORMS dict keys ("change_password", ...) as hardcoded passwords
skips = ["B101", "B105"]

[tool.coverage.run]
branch = true
omit = [
  '*/migrations/*',
  '*/tests/*',
  '*/test_*.py',
  '*/wsgi.py',
  '*/asgi.py',
  '*/manage.py',
  '*/core/*',
  '*/scripts/*'
]

[tool.djlint]
# allauth's element-system tags, opaque to djlint without this
custom_blocks = "element,slot,setvar"
ignore = "T002,H006"
profile = "django"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
addopts = "--reuse-db --nomigrations"
filterwarnings = [
  # django-import-export's own admin internals, not code of ours to fix.
  # Re-check on every django-import-export bump whether it still needs this (#76).
  "ignore:Overriding get_actions\\(\\) without the 'action_location' parameter is deprecated:django.utils.deprecation.RemovedInDjango70Warning",
  "ignore:The 'get_valid_export_item_pks\\(\\)' method in members.admin.MemberAdmin is deprecated:DeprecationWarning"
]
python_files = "test_*.py"
testpaths = ["tests"]
xfail_strict = true

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
ignore = ["E501", "E741"]
select = ["E", "F", "B", "I"]
