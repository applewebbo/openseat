name: CI

on:
  push:
    branches: [main, 20**]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-key
      ENVIRONMENT: test
      DEBUG: 'False'
      TEST_WORKERS: '4'
    steps:
    - uses: actions/checkout@v5

    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - run: uv sync --frozen

    - name: Lint
      run: uvx prek run --all-files

    - name: Compile translations
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends gettext
        uv run python manage.py compilemessages -l it -l en --ignore=.venv

    - name: Tests with coverage
      run: |
        uv run pytest -n "$TEST_WORKERS" --dist loadscope --cov=. \
          --cov-report term:skip-covered --cov-fail-under 100

  deploy:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Trigger the Coolify deploy
      env:
        COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      run: |
        curl -fsS -X POST "$COOLIFY_WEBHOOK_URL" \
          -H "Authorization: Bearer $COOLIFY_TOKEN"
