repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-added-large-files

- repo: https://github.com/asottile/pyupgrade
  rev: v3.21.2
  hooks:
  - id: pyupgrade
    args: [--py314-plus]

- repo: https://github.com/adamchainz/django-upgrade
  rev: 1.31.1
  hooks:
  - id: django-upgrade
    args: [--target-version, '6.1']

  # FORMATTERS
- repo: https://github.com/adamchainz/djade-pre-commit
  rev: 1.9.0
  hooks:
  - id: djade
    # djade 1.9.0 tops out at 6.0; raise to 6.1 once it ships support
    args: [--target-version, '6.0']
    files: ^templates/.*\.html$

- repo: local
  hooks:
  - id: rustywind
    name: rustywind Tailwind CSS class linter
    language: node
    additional_dependencies: [rustywind@latest]
    entry: rustywind
    args: [--write]
    types_or: [html]

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.2
  hooks:
  - id: ruff-format

- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.16.0
  hooks:
  - id: pretty-format-toml
    args: [--autofix]
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']

  # LINTERS
- repo: https://github.com/djlint/djLint
  rev: v1.44.1
  hooks:
  - id: djlint-django
    files: ^templates/.*\.html$
    # Mail templates are exempt: a mail client reads no stylesheet, so every
    # rule has to travel inline with the tag it styles.
    exclude: ^templates/.*/mail/.*\.html$

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.2
  hooks:
  - id: ruff
    args: [--fix, --exit-non-zero-on-fix]

- repo: https://github.com/PyCQA/bandit
  rev: 1.9.4
  hooks:
  - id: bandit
    args: [-c, pyproject.toml]
    additional_dependencies: [toml==0.10.2]
