site_name: OpenSeat Documentazione
site_url: https://applewebbo.github.io/openseat/it/
repo_url: https://github.com/applewebbo/openseat
repo_name: openseat
edit_uri: edit/main/docs/it/

theme:
  name: material
  language: it
  custom_dir: docs/overrides-it
  palette:
  - scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/brightness-7
      name: Passa alla modalità scura
  - scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/brightness-4
      name: Passa alla modalità chiara
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.top
  - navigation.tracking
  - search.suggest
  - search.highlight
  - content.code.copy
  - content.action.edit

extra_css:
- assets/stylesheets/daisyui-theme.css

docs_dir: docs/it

plugins:
- search

nav:
- Home: index.md
- Guida Visitatori:
  - Associarsi: visitor-guide/join.md
  - Prenotare un Evento: visitor-guide/booking.md
  - Gestire la Propria Prenotazione: visitor-guide/manage-booking.md
  - Il Consenso del Secondo Genitore: visitor-guide/second-parent.md
  - Novità e Informazioni: visitor-guide/pages.md
- Guida Amministratore:
  - Associazione: admin-guide/association.md
  - Moduli Pubblici: admin-guide/forms.md
  - Costruttore di Moduli: admin-guide/form-builder.md
  - Eventi: admin-guide/events.md
  - Prenotazioni: admin-guide/bookings.md
  - Check-in il Giorno dell'Evento: admin-guide/checkin.md
  - Richieste di Adesione: admin-guide/submissions.md
  - Registro Soci: admin-guide/members.md
  - Utenti e Permessi: admin-guide/users.md
  - Backup: admin-guide/backups.md

markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- attr_list
- md_in_html
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
